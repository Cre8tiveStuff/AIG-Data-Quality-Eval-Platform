[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aig-data-quality-eval-engine"
version = "0.1.0"
description = "Data quality evaluation engine for LLM outputs and datasets"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "pyarrow",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
dq-eval = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]